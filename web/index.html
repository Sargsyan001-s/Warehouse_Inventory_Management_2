<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Складской учёт товаров">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Складской учёт">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Складской учёт</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #f5f9fc;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: linear-gradient(160deg, #e3f2fd 0%, #ffffff 55%, #f5f9fc 100%);
      color: #0d47a1;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #app-loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #app-loading .brand {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    #app-loading .subtitle {
      color: #546e7a;
      font-size: 0.95rem;
    }
    #app-loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #bbdefb;
      border-top-color: #1976d2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="brand">Складской учёт</div>
    <div class="subtitle">Загрузка приложения…</div>
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (!el) return;
      el.classList.add('fade-out');
      setTimeout(function () { el.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
